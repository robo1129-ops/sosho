<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SO-SHO BLE診断</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">SO-SHO / ZMK Studio</p>
      <h1>BLE接続診断</h1>
      <p class="muted">公開ページと独立したWeb Bluetooth接続を確認します。</p>
    </header>

    <section class="actions" aria-label="操作">
      <button id="check" type="button">ブラウザー診断</button>
      <button id="connect" type="button">soshoへ接続</button>
      <button id="disconnect" type="button" disabled>切断</button>
    </section>

    <p id="status" class="status" role="status" aria-live="polite">未接続</p>

    <section class="log-card" aria-labelledby="log-heading">
      <div class="log-heading">
        <h2 id="log-heading">接続ログ</h2>
        <div>
          <button id="copy" type="button">コピー</button>
          <button id="clear" type="button">クリア</button>
        </div>
      </div>
      <ol id="log" aria-live="polite"><li>まだログはありません</li></ol>
    </section>

    <p class="footnote">この拡張機能はWindowsのBluetooth設定やファームウェアを変更しません。ChromeのDevice Pickerで明示的な選択が必要です。</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
